# ─── Server Configuration ───
# proxy.conf - Configuration file for  reverse proxy cache

# Base server settings
port = 3490


# ─── Connections & Pooling ───
# Number of buckets in the idle connection pool
pool_buckets = 1024
# Maximum total connection structs pre-allocated in the memory pool
pool_max_connections = 12000
# Idle limit before a connection is pruned (seconds)
idle_timeout_sec = 300

# ─── Circuit Breaker & High Availability ───
# If upstream takes longer than this (microsecs), it triggers early failure detection
latency_upstream_threshold = 1500000
# Cooldown period (seconds) before allowing half-open probes to a failing upstream
cooldown_sec = 5
# Number of consecutive errors required to trip the circuit breaker
max_consecutive_errors = 20

# ─── Cache Settings ───
# Maximum RAM allocated for cache (bytes). Ex: 50MB = 52428800
max_cache_mem = 52428800
# Files larger than this (bytes) bypass RAM and use zero-copy sendfile() from disk
large_file_threshold = 1048576
# Default Time-To-Live for cached items (seconds)
default_ttl = 300
# How often the idle cache expiry reaper runs (seconds)
expiry_interval = 60
# Minimum hits required before a cache item qualifies for background prefetching
prefetch_threshold = 5
# Trigger prefetch if the item expires within this many seconds
prefetch_window = 30

# ─── Rate Limiter ───
# Token bucket capacity per client IP
rate_limiter_capacity = 10
# Number of tokens refilled per second
refill_rate = 1
# Time (seconds) before dropping an inactive client from the rate limiter tracker
client_timeout = 300
# How often the rate limiter memory cleanup sweep runs (seconds)
cleanup_interval = 120
# Internal hash table size for tracking rate limits
hash_table_size = 4096

# ─── Logging ───
# Four Types of Logging Levels:
#   LEVEL_DEBUG = Verbose: Headers, Variables, Connection details
#   LEVEL_INFO = Standard: Requests, Start/Stop events
#   LEVEL_WARN = Warning: Cache full, High latency (Recoverable)
#   LEVEL_ERROR = Critical: Malloc failure, Bind failed (Non-recoverable)
log_level = LEVEL_WARN
# Queue size for the asynchronous logger
log_queue_size = 8192
# Maximum bytes per log line
max_log_msg = 256
# How many logs are flushed to disk in a single batch
log_batch_size = 1024
